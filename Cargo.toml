[package]
name = "speer-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jk20342/speer-sys-rust"
homepage = "https://github.com/jk20342/speer-sys-rust"
description = "raw rust ffi bindings for speer"
links = "speer"
build = "build.rs"

[features]
default = ["build-from-source"]
build-from-source = ["dep:cmake"]
full-chat = ["libp2p-tcp"]
libp2p-tcp = []
static = []

[build-dependencies]
bindgen = "0.72"
cmake = { version = "0.1", optional = true }
pkg-config = "0.3"
